/* ---------- Readability for older eyes: a little heavier, a little bigger, higher contrast ---------- */
body{font-weight:500;-webkit-font-smoothing:antialiased}
.muted{color:#5c5547;font-size:15px}
.btn{font-size:15px;font-weight:600;min-height:48px}
.btn.small{font-size:13px;min-height:42px}
.text-btn{font-size:14px;font-weight:600;min-height:44px}
nav button{font-size:16px}
label{font-size:15px;font-weight:600}
input,select,textarea{font-size:16px}
.med h3,.routine-row strong,.appointment h3,.chat-card h3{font-size:16px}
.med p,.routine-row small,.appointment p,.chat-card p,.card-foot,.progress-line{font-size:13px}
.eyebrow{font-size:11px;font-weight:700}
.notice{font-size:14px;color:#5e4a26}
.breadcrumb,.help-card{font-size:14px}

/* ---------- Three sizes (Standard / Large / Extra large) ---------- */
.large .btn{min-height:54px;font-size:17px}
.large .btn.small{min-height:46px;font-size:15px}
.large label,.large input,.large select{font-size:18px}
.large .med p,.large .routine-row small,.large .appointment p{font-size:15px}
.xlarge{font-size:21px}
.xlarge .muted,.xlarge .notice,.xlarge .med p,.xlarge .routine-row small,.xlarge .appointment p,.xlarge .chat-card p,.xlarge .progress-line{font-size:18px}
.xlarge .btn,.xlarge .text-btn{min-height:60px;font-size:19px}
.xlarge .btn.small{min-height:52px;font-size:17px}
.xlarge h1{font-size:42px}.xlarge h2,.xlarge .card-head h2{font-size:30px}.xlarge h3,.xlarge .med h3,.xlarge .routine-row strong,.xlarge .appointment h3{font-size:20px}
.xlarge label,.xlarge input,.xlarge select{font-size:20px}
.xlarge nav button{font-size:18px}
.xlarge .quote-text{font-size:28px}
.xlarge .message{font-size:19px}
.xlarge .eyebrow{font-size:13px}
@media(max-width:540px){.xlarge nav button{font-size:13px}.xlarge h1{font-size:34px}}
.size-choice button{min-width:52px;font-weight:700}
.size-choice button:nth-child(2){font-size:16px}.size-choice button:nth-child(3){font-size:19px}

/* ---------- Phones: every page reachable, bigger touch targets ---------- */
@media(max-width:540px){
  .sidebar{height:78px}
  nav{overflow-x:auto;justify-content:flex-start;scrollbar-width:none;padding:0 4px}
  nav::-webkit-scrollbar{display:none}
  nav button,nav button[data-page=settings],nav button[data-page=care]{display:flex;flex:0 0 auto;min-width:76px;font-size:12px;min-height:66px}
  .workspace{padding-bottom:84px}
  .btn{min-height:50px}
  .row-actions .btn{flex:1 1 auto}
  .member{flex-wrap:wrap}
  .member .row-actions{width:100%}
}

/* ---------- Thought for the day ---------- */
.quote-card{margin-top:24px;border-color:#e3d3ad;background:linear-gradient(110deg,#fffaf0,#fffefa)}
.quote-card .eyebrow{display:flex;align-items:center;gap:8px}
.quote-card .eyebrow svg{width:18px;height:18px}
.quote-text{font:500 21px/1.6 'Playfair Display','Noto Sans Devanagari',serif;margin:12px 0 16px;color:var(--ink)}
.large .quote-text{font-size:24px}

/* ---------- Tour ---------- */
.tour-text{font-size:18px;line-height:1.7}
.tour-count{margin:14px 0 0}
.tour-actions{flex-wrap:wrap}

/* ---------- Loved ones ---------- */
.loved-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.loved-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 12px;text-align:center;color:var(--ink)}
.loved-card:hover{background:var(--soft)}
.loved-card strong{font-size:18px}
.loved-card small{color:var(--muted);font-size:14px}
.loved-photo{width:110px;height:110px;border-radius:50%;overflow:hidden;background:#f0e5cc;display:grid;place-items:center;border:3px solid #e2d4b8;font:36px 'Playfair Display',serif;color:#80632d;margin-bottom:6px}
.loved-photo.big{width:160px;height:160px;margin:0 auto 12px}
.loved-photo img{width:100%;height:100%;object-fit:cover}
.loved-detail{display:grid;gap:14px;text-align:center}
.loved-big{width:100%;max-height:360px;object-fit:cover;border-radius:12px}
.loved-detail video{width:100%;border-radius:12px;background:var(--ink)}
.voice-row{display:grid;gap:6px;text-align:left}
.voice-row audio{width:100%}

/* ---------- Care circle ---------- */
.member .details{flex:1;min-width:160px}
.member .avatar{font-size:18px}
.invite-code{margin-top:18px;padding:18px;border:1px dashed #cbb477;border-radius:12px;background:#fffaf0;display:grid;gap:10px;justify-items:start}
.invite-code strong{font:700 36px/1.2 'DM Sans',sans-serif;letter-spacing:6px;color:#6b4d16}
.btn.danger{color:#9a4039}
.account-card .btn{white-space:nowrap}

@media(max-width:540px){.number-grid{grid-template-columns:1fr 1fr}.number-card strong{font-size:24px}.help-buttons{grid-template-columns:1fr}.alert-row .row-actions,.today-med .row-actions{width:100%}#care-alert{padding:22px}}
.help-share{display:flex;margin-top:14px}

function header(title,subtitle){return `<div class="page-heading"><div class="eyebrow">${t('YOUR SPACE. YOUR PACE.','आपकी जगह। आपकी रफ़्तार।')}</div><h1>${title}</h1><p class="muted">${subtitle}</p></div>`}
function render(){document.documentElement.lang=state.lang;document.body.classList.toggle('large',state.large);document.querySelector('#app').innerHTML=`<aside class="sidebar"><div class="brand"><svg class="brand-mark" viewBox="0 0 40 46" aria-hidden="true"><path d="m20 3 15 6v13c0 10-15 20-15 20S5 32 5 22V9Z"/><path d="M20 32V14m0 12c-9 0-11-7-11-7 7-2 11 7 11 7Zm0-4c8 0 10-8 10-8-7-1-10 8-10 8Z"/></svg><div class="brand-name">Aegis Home<small>CARE, CLOSER TO HOME</small></div></div><div class="nav-label">${t('YOUR EVERYDAY','आपका हर दिन')}</div><nav aria-label="${t('Main navigation','मुख्य मेनू')}">${navs.map(([id,en,hi])=>`<button data-page="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}>${icon(ni[id]||id)}<span>${t(en,hi)}</span></button>`).join('')}</nav><div class="sidebar-bottom"><div class="help-card">${icon('care')}<strong> ${t('A little help?','थोड़ी मदद चाहिए?')}</strong><p>${t('Your loved ones are always a little closer.','आपके अपने हमेशा आपके करीब हैं।')}</p><button data-page="care">${t('My care circle','मेरा देखभाल समूह')} ${icon('arrow')}</button></div><div class="sidebar-foot">${t('Made with care, for you.','आपके लिए, प्यार से।')}</div></div></aside><div class="workspace"><header class="topbar"><div class="breadcrumb">${t('My home','मेरा घर')} <span style="margin:0 10px;color:#c9bda5">/</span> ${t(navs.find(x=>x[0]===page)[1],navs.find(x=>x[0]===page)[2])}</div><div class="top-actions"><div class="lang" aria-label="Language / भाषा"><button data-lang="en" class="${state.lang==='en'?'active':''}" aria-pressed="${state.lang==='en'}">English</button><button data-lang="hi" class="${state.lang==='hi'?'active':''}" aria-pressed="${state.lang==='hi'}">हिन्दी</button></div><button class="icon-btn" data-action="size" aria-label="${t('Toggle larger text','बड़े अक्षर चुनें')}" aria-pressed="${state.large}">A<span style="font-size:10px;position:absolute;margin:16px 0 0 19px">+</span></button><button class="icon-btn" data-action="not function hero(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">${t('A LITTLE CARE, EVERY DAY','हर दिन, थोड़ी देखभाल')}</div><h2>${t('Your day, with a little<br>more peace of mind.','आपका हर दिन,<br>थोड़ा और सुकून भरा।')}</h2><p>${t('Your medicines, your moments of calm, and the people who care. All together, right here.','आपकी दवाएँ, सुकून के पल और आपके अपने। सब एक साथ, यहीं।')}</p><div class="hero-tags"><span>${icon('shield')}${t('Care on your terms','आपकी इच्छा से देखभाल')}</span><span>${icon('heart')}${t('Made for your everyday','आपके हर दिन के लिए')}</span></div></div><svg class="hero-art" viewBox="0 0 280 240" aria-hidden="true"><circle cx="155" cy="113" r="94" stroke-width=".6"/><circle cx="155" cy="113" r="82" stroke-width=".4" stroke-dasharray="2 5"/><path d="M45 223h215M65 229h175" stroke-width=".7"/><path d="M153 206C90 164 94 107 153 57c59 50 63 107 0 149Z" fill="#e8d5a955"/><path d="M153 206C78 201 49 146 67 102c47 8 82 53 86 104Zm0 0c75-5 104-60 86-104-47 8-82 53-86 104Z" fill="#eddcb955"/><path d="M153 206C82 225 38 194 32 155c47-10 88 13 121 51Zm0 0c71 19 115-12 121-51-47-10-88 13-121 51Z" fill="#e7d1a255"/><path d="M153 205V91m0 112-56-70m56 70 56-70" stroke-width=".7"/><path d="m153 10 3 7-3 7-3-7Z" fill="#a48144"/></svg></section>`}

function medRows(edit=false){return state.meds.map(m=>`<div class="med ${m.taken?'done':''}"><div class="med-icon">${icon(m.taken?'check':'pill')}</div><div class="med-info"><h3>${esc(localName(m))}</h3><p>${esc(state.lang==='hi'?(m.doseHi||m.dose):m.dose)} · ${esc(state.lang==='hi'?(m.noteHi||m.note):m.note)}</p>${edit?`<button class="text-btn" data-edit-med="${m.id}">${t('Edit medicine','दवा बदलें')}</button>`:''}</div><div><div class="med-time">${time(m.time)}</div><button class="${m.taken?'taken':'btn small'}" data-take="${m.id}">${m.taken?icon('check'):''}${m.taken?t('Taken · undo','ले ली · वापस करें'):t('Mark as taken','ले ली है')}</button></div></div>`).join('')||`<p class="empty">${t('Add your first medicine schedule.','अपनी पहली दवा का समय जोड़ें।')}</p>`}
function medCard(){const count=state.meds.filter(m=>m.taken).length;return `<section class="card"><div class="card-pad"><div class="card-head"><div class="card-title">${icon('pill')}<h2>${t('Today’s medicines','आज की दवाएँ')}</h2></div><button class="text-btn" data-page="meds">${t('View all','सभी देखें')}${icon('arrow')}</button></div><div class="progress-line"><span>${t('A small step towards feeling your best.','अपना ख्याल रखने का एक छोटा कदम।')}</span><span>${count}/${state.meds.length} ${t('taken','ली गईं')}</span></div><div class="progress"><div style="width:${state.meds.length?100*count/state.meds.length:0}%"></div></div>${medRows()}</div><div class="card-foot">${icon('bell')}${t('Reminder setup available in My medicines','रिमाइंडर सेटअप मेरी दवाएँ में उपलब्ध है')}</div></section>`}
function routineRows(){return state.routines.map(r=>`<div class="routine-row"><button data-routine="${r.id}" class="${r.done?'checked':''}" aria-label="${esc(localName(r))}" aria-pressed="${r.done}">${r.done?icon('check'):''}</button><div class="details"><strong>${esc(localName(r))}</strong><small>${time(r.time)}</small></div>${icon(r.type)}</div>`).join('')}
function routineCard(){return `<section class="card card-pad"><div class="card-head"><div class="card-title">${icon('sun')}<h2>${t('Little daily rituals','हर दिन की छोटी आदतें')}</h2></div><button class="text-btn" data-page="routine">${t('My routine','मेरी दिनचर्या')}${icon('arrow')}</button></div>${routineRows()}</section>`}
function musicCard(){return `<section class="card music-card"><div class="music-top"><div><div class="eyebrow">${t('A MOMENT FOR YOU','एक पल, अपने लिए')}</div><h2 style="margin-top:9px">${t('Find your little calm.','पाइए थोड़ा सुकून।')}</h2></div><div class="music-emblem">${icon('lotus')}</div></div><p class="muted">${t('A familiar melody. A quiet breath. Your time.','एक जानी-पहचानी धुन। एक शांत साँस। आपका समय।')}</p><div class="music-options"><button data-music="bhajan">${icon('music')}${t('Bhajans','भजन')}</button><button data-music="meditate">${icon('lotus')}${t('Meditate','ध्यान')}</button></div><button class="text-btn" data-music="classical">${t('Explore classical & favourites','शास्त्रीय संगीत और पसंदीदा गाने')}${icon('arrow')}</button></section>`}
function appointmentCard(){let a=state.appointments[0];return `<section class="card card-pad"><div class="card-head"><div class="card-title">${icon('calendar')}<h2>${t('Next appointment','अगला अपॉइंटमेंट')}</h2></div></div>${a?appointmentRow(a):`<p class="muted">${t('A clear calendar, a calmer mind. Add your next doctor visit here.','अगली डॉक्टर की मुलाकात यहाँ जोड़ें, ताकि याद रखना आसान हो।')}</p>`}<button class="btn secondary" style="width:100%" data-action="appointment">${icon('plus')}${t('Add appointment','अपॉइंटमेंट जोड़ें')}</button></section>`}
function appointmentRow(a){const d=new Date(a.date+'T12:00:00');return `<div class="appointment"><div class="date-tile"><strong>${d.getDate()}</strong><span>${d.toLocaleDateString(state.lang==='hi'?'hi-IN':'en-IN',{month:'short'})}</span></div><div><h3>${esc(a.name)}</h3><p>${esc(a.place)}</p><p>${time(a.time)}</p></div></div>`}
function medsPage(){return `${header(t('My medicines','मेरी दवाएँ'),t('Your schedule, easy to follow. Add only what your clinician has prescribed.','आपकी दवाओं का आसान समय-पत्र। केवल डॉक्टर की लिखी दवाएँ जोड़ें।'))}<div class="card wide-card"><div class="card-head"><h2>${t('Medicine schedule','दवाओं का समय')}</h2><button class="btn" data-action="add-med">${icon('plus')}${t('Add medicine','दवा जोड़ें')}</button></div>${medRows(true)}</div><div class="notice">${t('These are sample medicine entries, not treatment advice. Taken records in this preview are local demo records, not a clinical adherence history.','ये नमूना प्रविष्टियाँ हैं, इलाज की सलाह नहीं। इस पूर्वावलोकन में दवा लेने के रिकॉर्ड केवल स्थानीय नमूने हैं।')}</div><div class="card wide-card"><h2>${t('Email reminders','ईमेल रिमाइंडर')}</h2><p class="muted">${t('Upcoming doses, missed doses and appointments will have separate reminders. Email delivery needs the backend connection.','आने वाली दवाओं, छूटी दवाओं और अपॉइंटमेंट के लिए अलग रिमाइंडर होंगे। ईमेल भेजने के लिए बैकएंड कनेक्शन चाहिए।')}</p><button class="btn secondary" data-action="notifications">${t('See reminder plan','रिमाइंडर योजना देखें')}</button></div>`}
function routinePage(){return `${header(t('My daily routine','मेरी दिनचर्या'),t('Small moments that make the day feel like yours.','छोटी-छोटी आदतें, जो दिन को अपना बनाती हैं।'))}<div class="card wide-card"><div class="card-head"><h2>${t('My rituals','मेरी आदतें')}</h2><button class="btn" data-action="add-routine">${icon('plus')}${t('Add activity','गतिविधि जोड़ें')}</button></div>${routineRows()}</div><p class="muted" style="margin-top:18px">${t('Sample activities are optional. Choose routines that suit your needs and your clinician’s guidance.','नमूना गतिविधियाँ वैकल्पिक हैं। अपनी ज़रूरत और डॉक्टर की सलाह के अनुसार दिनचर्या चुनें।')}</p>`}
function appointmentsPage(){return `${header(t('My appointments','मेरे अपॉइंटमेंट'),t('Keep the next visit, and its details, in one place.','अगली मुलाकात की सारी जानकारी एक जगह रखें।'))}<div class="card wide-card"><div class="card-head"><h2>${t('Upcoming visits','आने वाली मुलाकातें')}</h2><button class="btn" data-action="appointment">${icon('plus')}${t('Add visit','मुलाकात जोड़ें')}</button></div>${state.appointments.length?state.appointments.map(a=>`<div class="settings-row">${appointmentRow(a)}<button class="text-btn danger" data-delete-appointment="${a.id}">${t('Remove','हटाएँ')}</button></div>`).join(''):`<div class="empty">${icon('calendar')}<p>${t('No appointments yet. Add one when you’re ready.','अभी कोई अपॉइंटमेंट नहीं है। जब चाहें, जोड़ें।')}</p></div>`}</div>`}
function musicPage(){return `${header(t('Peace, at your own pace.','सुकून, आपकी अपनी रफ़्तार से।'),t('Bhajans, classical melodies, or a few quiet minutes. Choose what feels good.','भजन, शास्त्रीय संगीत या कुछ शांत पल। जो अच्छा लगे, वह चुनें।'))}<div class="music-grid"><section class="card album"><div class="album-cover">${icon('music')}</div><h2>${t('Bhajans & devotion','भजन और भक्ति')}</h2><p class="muted">${t('Find familiar voices and devotional favourites.','जानी-पहचानी आवाज़ें और अपने पसंदीदा भजन खोजें।')}</p><a class="btn secondary" href="https://www.youtube.com/results?search_query=hindi+bhajans" target="_blank" rel="noopener">${icon('play')}${t('Find bhajans on YouTube','YouTube पर भजन खोजें')}</a></section><section class="card album"><div class="album-cover" style="background:radial-gradient(circle,#d9dfce,#f0f2e9)">${icon('lotus')}</div><h2>${t('A quiet moment','सुकून के पल')}</h2><p class="muted">${t('Relax your shoulders. Breathe naturally, without holding your breath.','कंधे ढीले छोड़ें। साँस रोके बिना, आराम से साँस लें।')}</p><button class="btn secondary" data-action="breathe">${icon('lotus')}${t('Begin a quiet minute','एक शांत मिनट शुरू करें')}</button></section><section class="card album"><div class="album-cover" style="background:radial-gradient(circle,#e4d2bb,#f7efe6)">${icon('music')}</div><h2>${t('Classical & favourites','शास्त्रीय और पसंदीदा')}</h2><p class="muted">${t('An old favourite, or a beautiful Indian raga.','कोई पुराना पसंदीदा गीत या मधुर भारतीय राग।')}</p><a class="btn secondary" href="https://www.youtube.com/results?search_query=indian+classical+instrumental" target="_blank" rel="noopener">${icon('play')}${t('Find classical music','शास्त्रीय संगीत खोजें')}</a></section></div><div class="card wide-card" style="margin-top:24px"><h2>${t('Play your own favourite','अपना पसंदीदा गाना सुनें')}</h2><p class="muted">${t('Choose a song from your device. It stays on your device and is never uploaded.','अपने डिवाइस से गाना चुनें। यह कहीं अपलोड नहीं होता।')}</p><label for="audio-file">${t('Choose an audio file','ऑडियो फ़ाइल चुनें')}</label><input type="file" id="audio-file" accept="audio/*"><audio id="player" controls style="width:100%;margin-top:15px" aria-label="${t('Music player','संगीत प्लेयर')}"></audio></div><p class="muted" style="margin-top:16px">${t('YouTube links open a new tab and may show ads. No music plays automatically.','YouTube लिंक नए टैब में खुलते हैं और विज्ञापन दिखा सकते हैं। संगीत अपने आप नहीं बजता।')}</p>`}
function chatPage(){return `${header(t('A conversation with Saathi','साथी से बातचीत'),t('A little company, whenever you feel like talking.','जब बात करने का मन हो, थोड़ा साथ।'))}<div class="notice">${t('Preview conversation: replies below are scripted examples, not live AI. Saathi will be an AI companion, not a person or a medical professional.','पूर्वावलोकन बातचीत: नीचे के जवाब नमूने हैं, लाइव AI नहीं। साथी एक AI सहायक होगा, व्यक्ति या डॉक्टर नहीं।')}</div><div class="card"><div class="chat-area" aria-live="polite"><div class="message">${t('Namaste! I’m Saathi. What would you like to talk about today — a favourite memory, music, or how your day feels?','नमस्ते! मैं साथी हूँ। आज किस बारे में बात करें — कोई प्यारी याद, संगीत, या आपका दिन कैसा रहा?')}</div>${state.messages.map(m=>`<div class="message ${m.user?'user':''}">${esc(m.text)}</div>`).join('')}</div><div class="suggestions">${[["Tell me about music","संगीत की बात करें"],["I feel lonely","मैं अकेला महसूस कर रहा हूँ"],["Help me with my medicines","दवाओं के बारे में मदद चाहिए"]].map(([en,hi])=>`<button class="btn secondary small" data-prompt="${t(en,hi)}">${t(en,hi)}</button>`).join('')}</div><form class="chat-form" id="chat-form"><input id="chat-input" maxlength="1000" required aria-label="${t('Your message','आपका संदेश')}" placeholder="${t('Type what’s on your mind…','अपने मन की बात लिखें…')}"><button class="btn" type="submit">${t('Send','भेजें')}${icon('arrow')}</button></form></div>`}
function carePage(){return `${header(t('Your people. Your care circle.','आपके अपने। आपका देखभाल समूह।'),t('You decide who can help, and what they can see.','कौन मदद करेगा और क्या देख सकेगा, यह आप तय करें।'))}<div class="card wide-card"><div class="card-title">${icon('shield')}<h2>${t('You’re in control','निर्णय आपके हाथ में है')}</h2></div><p class="muted">${t('Invite a trusted family member or caregiver with a secure, expiring passcode. Choose view-only or care-management access.','किसी भरोसेमंद परिजन या देखभालकर्ता को सीमित समय के सुरक्षित पासकोड से जोड़ें। केवल देखने या देखभाल प्रबंधन की अनुमति चुनें।')}</p><div class="member"><div class="avatar">${icon('heart')}</div><div><p>${t('You · Profile owner','आप · प्रोफ़ाइल मालिक')}</p><small>${t('Manage your care and permissions','अपनी देखभाल और अनुमतियाँ संभालें')}</small></div></div><div class="empty">${t('No one has been invited yet.','अभी किसी को नहीं जोड़ा गया है।')}</div><button class="btn" data-action="invite">${icon('plus')}${t('Preview an invitation','निमंत्रण का नमूना देखें')}</button></div><div class="notice">${t('Secure sharing is not active in this preview. Real invitations need sign-in, server-side access checks, passcode expiry and attempt limits. No health information is shared here.','इस पूर्वावलोकन में सुरक्षित साझाकरण सक्रिय नहीं है। असली निमंत्रण के लिए साइन-इन, सर्वर जाँच, पासकोड की समय सीमा और प्रयास सीमा ज़रूरी हैं। यहाँ स्वास्थ्य जानकारी साझा नहीं होती।')}</div>`}
function settingsPage(){return `${header(t('Make yourself comfortable','अपनी सुविधा के अनुसार'),t('A few simple choices, to make this home yours.','कुछ आसान विकल्प, ताकि यह घर आपका लगे।'))}<div class="card wide-card"><div class="settings-row"><div><h3>${t('Language','भाषा')}</h3><p class="muted">${t('English or Hindi, your choice.','अंग्रेज़ी या हिन्दी, आपकी पसंद।')}</p></div><div class="lang"><button data-lang="en">English</button><button data-lang="hi">हिन्दी</button></div></div><div class="settings-row"><div><h3>${t('Larger text','बड़े अक्षर')}</h3><p class="muted">${t('A little easier on the eyes.','पढ़ना थोड़ा और आसान।')}</p></div><button class="btn secondary" data-action="size" aria-pressed="${state.large}">${state.large?t('On','चालू'):t('Off','बंद')}</button></div><div class="settings-row"><div><h3>${t('Time zone','समय क्षेत्र')}</h3><p class="muted">${t('India Standard Time · Asia/Kolkata','भारतीय मानक समय · Asia/Kolkata')}</p></div></div><button class="text-btn danger" data-action="reset">${t('Reset sample data','नमूना डेटा रीसेट करें')}</button></div>`}
function modal(title,body){document.querySelector('#modal').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="icon-btn" data-close aria-label="${t('Close','बंद करें')}">${icon('close')}</button></div>${body}`;document.querySelector('#modal').showModal();document.querySelector('[data-close]').onclick=()=>document.querySelector('#modal').close()}
function medForm(id){let m=state.meds.find(x=>x.id===id);modal(m?t('Edit medicine','दवा बदलें'):t('Add a medicine','दवा जोड़ें'),`<form id="med-form"><label>${t('Medicine name','दवा का नाम')}<input name="name" value="${esc(m?.name||'')}" required maxlength="80"></label><label>${t('Dose as prescribed','पर्चे के अनुसार मात्रा')}<input name="dose" value="${esc(m?.dose||'')}" required maxlength="60"></label><label>${t('Time (IST)','समय (भारतीय मानक समय)')}<input type="time" name="time" value="${m?.time||'09:00'}" required></label><label>${t('Instructions from your prescription','आपके पर्चे पर लिखे निर्देश')}<input name="note" value="${esc(m?.note||'')}" maxlength="100"></label><div class="form-actions">${m?`<button type="button" class="text-btn danger" id="delete-med">${t('Remove','हटाएँ')}</button>`:''}<button class="btn" type="submit">${t('Save medicine','दवा सेव करें')}</button></div></form>`);document.querySelector('#med-form').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(!v.name.trim()||!v.dose.trim())return;const record={...v,id:m?.id||Date.now(),taken:m?.taken||false};state.meds=m?state.meds.map(x=>x.id===id?record:x):[...state.meds,record];state.meds.sort((a,b)=>a.time.localeCompare(b.time));save();document.querySelector('#modal').close();render();toast(t('Medicine schedule saved.','दवा का समय सेव हो गया।'))};if(m)document.querySelector('#delete-med').onclick=()=>{state.meds=state.meds.filter(x=>x.id!==id);save();document.querySelector('#modal').close();render()}}
function appointmentForm(){modal(t('Add an appointment','अपॉइंटमेंट जोड़ें'),`<form id="appointment-form"><label>${t('Doctor or visit name','डॉक्टर या मुलाकात का नाम')}<input name="name" required maxlength="80"></label><label>${t('Clinic or location','क्लिनिक या जगह')}<input name="place" required maxlength="100"></label><label>${t('Date','तारीख')}<input type="date" name="date" required></label><label>${t('Time (IST)','समय (भारतीय मानक समय)')}<input type="time" name="time" required></label><div class="form-actions"><button class="btn" type="submit">${t('Save appointment','अपॉइंटमेंट सेव करें')}</button></div></form>`);document.querySelector('#appointment-form').onsubmit=e=>{e.preventDefault();state.appointments.push({...Object.fromEntries(new FormData(e.target)),id:Date.now()});state.appointments.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));save();document.querySelector('#modal').close();render()}}
function chatSend(text){if(!text.trim())return;let reply=t('That sounds like something we could talk about. In the full version, I’ll respond to your stories and questions. For now, this is a sample conversation. Is there a favourite memory you’d like to share?','इस बारे में हम बात कर सकते हैं। पूरे संस्करण में मैं आपकी कहानियों और सवालों का जवाब दूँगा। अभी यह एक नमूना बातचीत है। क्या कोई प्यारी याद साझा करना चाहेंगे?');if(/medicin|dose|दवा|दवाओं/i.test(text))reply=t('I can help you find your saved schedule, but I can’t decide doses or tell you what to do after a missed dose. Please ask your doctor or pharmacist. Open My medicines to see or update your prescribed schedule.','मैं दवाओं का सेव किया समय दिखाने में मदद कर सकता हूँ, लेकिन मात्रा या छूटी दवा के बारे में सलाह नहीं दे सकता। डॉक्टर या फ़ार्मासिस्ट से पूछें। अपना समय देखने के लिए मेरी दवाएँ खोलें।');else if(/lonely|अकेल/i.test(text))reply=t('Feeling lonely can be difficult. Would you like to talk about someone you miss, or reach out to a loved one? A familiar voice can be comforting. This is a preview reply, but your need for connection matters.','अकेलापन मुश्किल लग सकता है। क्या किसी की याद आ रही है, या किसी अपने से बात करना चाहेंगे? एक जानी-पहचानी आवाज़ सुकून दे सकती है। यह नमूना जवाब है, लेकिन अपनों से जुड़ना मायने रखता है।');else if(/music|संगीत/i.test(text))reply=t('What kind of music brings back happy memories? You can visit Peace & music for bhajans, classical music, or play a favourite song from your device.','कौन-सा संगीत प्यारी यादें लाता है? सुकून और संगीत में भजन, शास्त्रीय संगीत या अपने डिवाइस का पसंदीदा गाना सुन सकते हैं।');state.messages.push({user:true,text},{user:false,text:reply});state.messages=state.messages.slice(-30);save();render();document.querySelector('.chat-area').scrollTop=99999;document.querySelector('#chat-input').focus()}

(function (root) {
  const parts = now => Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  }).formatToParts(now).map(p => [p.type, p.value]));
  const day = (now = new Date()) => { const p = parts(now); return `${p.year}-${p.month}-${p.day}`; };
  const key = (id, now = new Date()) => `${day(now)}:${id}`;
  const status = (medicine, records, now = new Date()) => {
    if (records[key(medicine.id, now)]) return 'taken';
    const p = parts(now), [h, m] = medicine.time.split(':').map(Number);
    const elapsed = Number(p.hour) * 60 + Number(p.minute) - (h * 60 + m);
    return elapsed >= 30 ? 'missed' : elapsed >= 0 ? 'due' : 'upcoming';
  };
  const api = {day, key, status};
  if (typeof module !== 'undefined') module.exports = api;
  else root.DoseLedger = api;
})(globalThis);

(function(root) {

  const LEADS = [1440, 60, 15, 0];
  const leadsOf = a => {
    const list = Array.isArray(a.leads) ? a.leads.map(Number).filter(n => LEADS.includes(n)) : [0];
    return [...new Set(list)];
  };

    const today = day(now);
    return [
      ...(state.routines || []).filter(r => r.alarm !== false && r.doneDate !== today).map(r => ({kind:'routine',id:r.id,name:r.name,hi:r.hi,time:r.time,date:today,due:at(today,r.time),key:`routine:${r.id}:${today}:${r.time}`})),

        const key = `appointment:${a.id}:${a.date}:${a.time}${lead ? `:${lead}` : ''}`;
        return {kind:'appointment',id:a.id,name:a.name,time:a.time,date:a.date,place:a.place,lead,due,remindDay:Number.isFinite(due)?day(new Date(due)):a.date,key};

      if(e.lead && now.getTime() >= e.due + e.lead*60000) return false;

async function findMusic(body) {
  mg = {...mg, loading: true, note: '', results: null};
  render();
  try {
    if (!onServer) throw new Error('offline');
    const data = await postJson('/api/music', {...body, lang: state.lang}, 45000);
    mg.query = data.query; mg.searchUrl = data.searchUrl; mg.results = (data.results || []).filter(s => /^[\w-]{11}$/.test(s.id));
    if (!mg.results.length) mg.note = t('I could not find a song to play here. You can open the search on YouTube.','यहाँ बजाने के लिए गाना नहीं मिला। आप YouTube पर खोज खोल सकते हैं।');
  } catch (error) {
    const q = error.data?.query || body.query || body.wish;
    mg.query = q; mg.results = [];
    mg.searchUrl = error.data?.searchUrl || `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`;

/* A named singer plays straight away; otherwise the guide asks the next question. */

}

const musicBeforeStep4 = musicPage;
musicPage = function() { return musicBeforeStep4().replace('<div class="music-grid">', `${guideCard()}<div class="music-grid">`); };

function appointmentForm4(id) {
  const item = state.appointments.find(x => String(x.id) === String(id));
  const leads = item ? (item.alarm === false ? [] : AlarmClock.leadsOf(item)) : [60, 0];
  modal(t('Your appointment','आपकी अपॉइंटमेंट'), `<form id="alarm-schedule"><label>${t('Name','नाम')}<input name="name" required maxlength="80" value="${esc(item?.name||'')}"></label><label>${t('Place','जगह')}<input name="place" required maxlength="100" value="${esc(item?.place||'')}"></label><label>${t('Date','तारीख')}<input name="date" type="date" required value="${esc(item?.date||AlarmClock.day())}"></label><label>${t('Time in India (IST)','भारत का समय (IST)')}<input name="time" type="time" required value="${esc(item?.time||'09:00')}"></label><fieldset class="lead-set"><legend>${t('When should the alarm ring?','घंटी कब बजे?')}</legend>${AlarmClock.LEADS.map(n => `<label class="alarm-check"><input type="checkbox" name="lead" value="${n}" ${leads.includes(n)?'checked':''}>${leadLabel(n)}</label>`).join('')}</fieldset><p>${t('The app needs to stay open for the alarm.','घंटी के लिए ऐप खुला रहना चाहिए।')}</p><div class="alarm-actions">${item?`<button type="button" class="btn secondary" id="remove-schedule">${t('Remove from my schedule','मेरी सूची से हटाएँ')}</button>`:''}<button class="btn" type="submit">${t('Save','सहेजें')}</button></div></form>`);

const scheduleFormBeforeStep4 = scheduleForm;
scheduleForm = function(kind, id) { return kind === 'appointment' ? appointmentForm4(id) : scheduleFormBeforeStep4(kind, id); };

const reminderSummary = a => a.alarm === false || !AlarmClock.leadsOf(a).length

function inTime(minutes) {
  if (minutes < 60) return t(`${minutes} minutes`, `${minutes} मिनट`);
  if (minutes < 1440) { const h = Math.round(minutes / 60); return t(`about ${h} hour${h > 1 ? 's' : ''}`, `लगभग ${h} घंटे`); }
  const d = Math.round(minutes / 1440); return t(`${d} day${d > 1 ? 's' : ''}`, `${d} दिन`);
}
const showAlarmBeforeStep4 = showAlarm;
showAlarm = function(event) {
  showAlarmBeforeStep4(event);
  if (event.kind !== 'appointment' || !event.lead) return;
  const minutes = Math.max(1, Math.round((AlarmClock.at(event.date, event.time) - Date.now()) / 60000));
  const line = alarmDialog.querySelector('h2 + p');
  if (line) line.textContent = t(`Your appointment is in ${inTime(minutes)}. A good time to get ready.`, `आपकी मुलाकात ${inTime(minutes)} में है। तैयार होने का अच्छा समय है।`);
};

/* ---------- Event wiring ---------- */
const bindBeforeStep4 = bind;
bind = function() {

  const wish = document.querySelector('#wish-form');
  if (wish) wish.onsubmit = e => { e.preventDefault(); const text = document.querySelector('#wish-input').value.trim(); if (text) { mg.fromGuide = false; findMusic({wish: text}); } };
  document.querySelector('[data-guide-back]')?.addEventListener('click', () => {
    if (mg.results) mg = {...mg, results: null, note: '', answers: mg.fromGuide ? mg.answers.slice(0, -1) : mg.answers};

(function (root) {
  // People sign in with number + passcode. Supabase stores this as an internal login address
  // made from the number. No email is ever sent to it.
  const LOGIN_DOMAIN = 'phone.aegishome.app';

  /* Accepts 98765 43210, 098765-43210, +91 98765 43210, 919876543210. Returns +919876543210 or null. */
  function normalize(input) {
    let digits = String(input || '').replace(/\D/g, '');
    if (digits.length === 12 && digits.startsWith('91')) digits = digits.slice(2);
    else if (digits.length === 11 && digits.startsWith('0')) digits = digits.slice(1);
    return /^[6-9]\d{9}$/.test(digits) ? `+91${digits}` : null;
  }
  const loginEmail = phone => `${phone.replace(/^\+/, '')}@${LOGIN_DOMAIN}`;
  const validPasscode = code => /^\d{6}$/.test(String(code || ''));
  /* Easy-to-guess passcodes, like 111111 or 123456. */
  const weakPasscode = code => /^(\d)\1{5}$/.test(code) || '0123456789'.includes(code) || '9876543210'.includes(code);
  const display = phone => phone ? `${phone.slice(0, 3)} ${phone.slice(3, 8)} ${phone.slice(8)}` : '';

  const api = {normalize, loginEmail, validPasscode, weakPasscode, display, LOGIN_DOMAIN};
  if (typeof module !== 'undefined') module.exports = api;

const Backend = (() => {

      client = window.supabase.createClient(config.url, config.anonKey, {auth: {persistSession: true, autoRefreshToken: true, storageKey: 'aegis-auth'}});
      const {data} = await client.auth.getSession();
      if (data.session) await loadProfile();

  }

  async function loadProfile() {

    if (!user) { profile = home = null; return null; }

    if (error) throw fail('load_failed', error);

  }

    if (file) {
      if (file.size > 5 * 1024 * 1024) throw fail('file_too_big');
      const ext = ({'application/pdf': 'pdf', 'image/png': 'png', 'image/webp': 'webp'})[file.type] || 'jpg';

      const {error} = await client.storage.from('licences').upload(path, file, {contentType: file.type, upsert: false});
      if (error) throw fail('upload_failed', error);

      profile_id: userId, org_name: details.orgName, licence_number: details.licenceNumber,
      licence_doc_path: path, lat: details.lat, lng: details.lng,

  }

  async function createProfile({role, name, lang, home: homeDetails}) {
    const {data: {user}} = await client.auth.getUser();
    if (!user) throw fail('signed_out');

      if (error) throw fail('sync_failed', error);
    }
    const keep = rows.map(r => r.id);
    let stale = client.from('medicines').update({active: false}).eq('elder_id', profile.id).eq('active', true);

  const raiseAlert = (kind, lat = null, lng = null, message = null) => rpc('raise_alert', {alert_kind: kind, alert_lat: lat, alert_lng: lng, alert_message: message});
  const updateAlertLocation = (id, lat, lng) => rpc('update_alert_location', {alert_id: id, p_lat: lat, p_lng: lng});
  const resolveAlert = id => rpc('resolve_alert', {alert_id: id});
  const acknowledgeAlert = id => rpc('acknowledge_alert', {alert: id});
  const nearestHomes = (lat, lng) => rpc('nearest_homes', {p_lat: lat, p_lng: lng, max_results: 5});
  async function alerts({openOnly = false, limit = 20} = {}) {
    let query = client.from('alerts').select('*, elder:profiles!alerts_elder_id_fkey(id, full_name, phone)').order('created_at', {ascending: false}).limit(limit);

    if (Phone.weakPasscode(values.passcode)) return refreshAccount({error: accountError('weak_passcode')});

  /* Fisher–Yates shuffle with an injectable random source (tests pass a seeded one). */
  function shuffle(n, random = Math.random) {
    const order = Array.from({length: n}, (_, i) => i);
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    return order;
  }

  /* deck = {order:[indexes], pos}. Returns the next quote index and the updated deck.
     Every quote appears once per round; a new round never starts with the one just shown. */
  function next(deck, random = Math.random) {
    let {order, pos} = deck && Array.isArray(deck.order) && deck.order.length === quotes.length ? deck : {order: shuffle(quotes.length, random), pos: 0};

      const last = order[order.length - 1];
      order = shuffle(quotes.length, random);
      if (order[0] === last) [order[0], order[1]] = [order[1], order[0]];
      pos = 0;
    }
    return {index: order[pos], deck: {order, pos: pos + 1}};
  }

  else root.Quotes = api;

  u.rate = 0.92;
  speechSynthesis.speak(u);
};

/* ---------- Thought for the day ---------- */
function advanceQuote() {
  const {index, deck} = Quotes.next(state.quoteDeck);
  state.quoteDeck = deck; state.quoteIndex = index; save();
}
advanceQuote(); // a fresh thought every time the app opens
function quoteCard() {
  const q = Quotes.quotes[state.quoteIndex] || Quotes.quotes[0];

}

const Narrator = (() => {
  let armed = null, armedAt = 0, lastText = '', lastAt = 0, hoverTimer, pointerType = 'mouse';
  const pick = node => node?.closest?.('button,a,input,select,textarea,[role=button],label,h1,h2,h3,p,li,.message,.dose-status,.eyebrow,small,strong');
  const interactive = el => el.matches('button,a,[role=button]');
  function textOf(el) {
    if (el.matches('input,select,textarea')) {
      const label = el.closest('label')?.childNodes[0]?.textContent || el.getAttribute('aria-label') || el.placeholder || '';
      const value = el.type === 'password' ? '' : el.tagName === 'SELECT' ? el.selectedOptions[0]?.textContent : el.value;
      return `${label} ${value || ''}`;
    }
    return el.getAttribute('aria-label') && interactive(el) ? `${el.getAttribute('aria-label')}. ${el.innerText}` : el.innerText || el.getAttribute('aria-label') || '';
  }
  function say(text) {
    const now = Date.now();
    text = String(text || '').replace(/\s+/g, ' ').trim();
    if (!text || (text === lastText && now - lastAt < 1500)) return;
    lastText = text; lastAt = now; speakText(text);
  }
  const on = () => state.narrator;
  document.addEventListener('pointerdown', e => { pointerType = e.pointerType; }, true);
  document.addEventListener('touchstart', e => { if (!on()) return; const el = pick(e.target); if (el && !interactive(el)) say(textOf(el)); }, {passive: true, capture: true});
  document.addEventListener('touchmove', e => {
    if (!on()) return;
    const touch = e.touches[0], el = pick(document.elementFromPoint(touch.clientX, touch.clientY));
    if (el && el !== armed) { armed = el; armedAt = Date.now(); say(textOf(el)); }
  }, {passive: true, capture: true});
  // On touch screens: the first tap reads a button aloud, a second tap uses it.
  document.addEventListener('click', e => {
    if (!on() || pointerType !== 'touch') return;
    const el = pick(e.target);
    if (!el || !interactive(el) || el.hasAttribute('data-narrator-toggle')) return;
    if (armed === el && Date.now() - armedAt < 5000) { armed = null; return; }
    e.preventDefault(); e.stopImmediatePropagation();
    armed = el; armedAt = Date.now();
    say(`${textOf(el)}. ${t('Tap again to choose.','चुनने के लिए फिर से दबाएँ।')}`);
  }, true);
  document.addEventListener('mouseover', e => {
    if (!on() || pointerType === 'touch') return;
    clearTimeout(hoverTimer);
    const el = pick(e.target);
    if (el) hoverTimer = setTimeout(() => say(textOf(el)), 300);
  }, true);
  document.addEventListener('focusin', e => { if (on()) { const el = pick(e.target); if (el) say(textOf(el)); } }, true);
  return {say};
})();

}

/* ---------- Loved ones storage ---------- */
const LocalLoved = (() => {
  const db = new Promise((resolve, reject) => {
    const request = indexedDB.open('aegis-loved-v1', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('people', {keyPath: 'id'});
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  db.catch(() => {});
  async function tx(mode, work) {
    const store = (await db).transaction('people', mode).objectStore('people');
    return new Promise((resolve, reject) => {
      const request = work(store);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }
  let urls = [];
  const url = blob => { if (!blob) return null; const u = URL.createObjectURL(blob); urls.push(u); return u; };
  return {
    async list() {
      urls.forEach(URL.revokeObjectURL); urls = [];
      const people = await tx('readonly', s => s.getAll());
      return people.sort((a, b) => a.created - b.created).map(p => ({id: p.id, name: p.name, relation: p.relation, photo: url(p.photo), video: url(p.video), voices: (p.voices || []).map(url)}));
    },
    add: ({name, relation, photo, video, voices = []}) => tx('readwrite', s => s.put({id: crypto.randomUUID(), created: Date.now(), name, relation, photo, video, voices})),
    async addVoice(id, blob) { const p = await tx('readonly', s => s.get(id)); p.voices = [...(p.voices || []), blob]; return tx('readwrite', s => s.put(p)); },
    remove: id => tx('readwrite', s => s.delete(id)),
  };
})();
const lovedShared = () => Backend.available() && Backend.profile()?.role === 'grandparent';
const lovedStore = () => lovedShared() ? Backend.loved : LocalLoved;
let loved = {items: null, loading: false, error: ''};
async function loadLoved() {
  if (loved.loading) return;
  loved.loading = true;
  try { loved.items = await lovedStore().list(); loved.error = ''; }
  catch { loved.items = loved.items || []; loved.error = t('Could not load your loved ones. Please check your internet.','आपके अपनों को लोड नहीं कर पाए। कृपया इंटरनेट देखें।'); }
  loved.loading = false;
  if (page === 'loved') render();
}

/* Photos are resized so they load fast on any phone. */
async function shrinkPhoto(file) {
  if (!file || !file.type.startsWith('image/')) return file;
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, 1280 / Math.max(bitmap.width, bitmap.height));
    const canvas = Object.assign(document.createElement('canvas'), {width: Math.round(bitmap.width * scale), height: Math.round(bitmap.height * scale)});
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    return await new Promise(resolve => canvas.toBlob(b => resolve(b || file), 'image/jpeg', 0.85));
  } catch { return file; }
}

/* Voice notes recorded in the app. */
let recorder = null;
async function toggleRecording(onDone, button) {
  if (recorder) { recorder.stop(); return; }
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast(t('Recording is not available here. You can choose an audio file instead.','यहाँ रिकॉर्डिंग उपलब्ध नहीं है। आप ऑडियो फ़ाइल चुन सकते हैं।'));
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    const type = ['audio/webm', 'audio/mp4', 'audio/ogg'].find(x => MediaRecorder.isTypeSupported(x));
    const chunks = [];
    recorder = new MediaRecorder(stream, type ? {mimeType: type} : undefined);
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(track => track.stop());
      const blob = new Blob(chunks, {type: (recorder.mimeType || 'audio/webm').split(';')[0]});
      recorder = null;
      if (button) button.textContent = t('Record a voice note','आवाज़ रिकॉर्ड करें');
      if (blob.size) onDone(blob);
    };
    recorder.start();
    if (button) button.textContent = t('Stop recording','रिकॉर्डिंग रोकें');
    toast(t('Recording… tap Stop when finished.','रिकॉर्ड हो रहा है… पूरा होने पर रोकें दबाएँ।'));
  } catch { recorder = null; toast(t('Please allow the microphone to record.','रिकॉर्ड करने के लिए माइक्रोफ़ोन की अनुमति दें।')); }
}

/* ---------- 1. Medicines and check-in photos, shared with the care circle ---------- */
state.sharedCheckins ||= {};
let medsSignature = '', syncing = false, syncTimer;
async function syncShared() {
  if (!isElder() || syncing) return;
  syncing = true;
  try {
    let changed = false;
    for (const m of state.meds) if (!m.remoteId) { m.remoteId = crypto.randomUUID(); changed = true; }
    if (changed) save();
    const signature = JSON.stringify(state.meds.map(m => [m.remoteId, m.name, m.dose, m.note, m.time]));
    if (signature !== medsSignature) {
      await Backend.syncMedicines(state.meds.map(m => ({remoteId: m.remoteId, name: m.name, dose: m.dose, note: m.note, time: m.time})));
      medsSignature = signature;
    }
    let shared = 0;
    for (const [key, record] of Object.entries(state.checkins || {})) {
      if (state.sharedCheckins[key]) continue;
      const [day, id] = [key.slice(0, 10), key.slice(11)];
      const med = state.meds.find(m => String(m.id) === id);
      if (!med || day < todayIST().slice(0, 8) + '01') continue;
      const blob = await photoStore('get', record.photoId);
      if (!blob) continue;
      await Backend.shareCheckin({medicineId: med.remoteId, day, blob});
      state.sharedCheckins[key] = {medicineId: med.remoteId, day};
      shared++;
    }
    // A check-in removed on this phone is removed for the care circle too.
    for (const [key, info] of Object.entries(state.sharedCheckins)) {
      if (state.checkins[key]) continue;
      await Backend.unshareCheckin(info);
      delete state.sharedCheckins[key];
    }
    save();
    if (shared) toast(t('Your check-in photo is shared with your care circle.','आपकी चेक-इन फ़ोटो आपके देखभाल समूह से साझा हो गई।'));
  } catch { /* Try again on the next change; the check-in stays safe on this phone. */ }
  syncing = false;
}
const queueSync = () => { clearTimeout(syncTimer); syncTimer = setTimeout(syncShared, 600); };

state.activeAlert ??= null;
let liveWatch = null, lastSent = 0;
function getLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(p => resolve({lat: +p.coords.latitude.toFixed(5), lng: +p.coords.longitude.toFixed(5)}), () => resolve(null), {enableHighAccuracy: true, timeout: 12000, maximumAge: 60000});
  });
}
function startLiveLocation() {
  if (liveWatch !== null || !state.activeAlert || !navigator.geolocation) return;
  liveWatch = navigator.geolocation.watchPosition(p => {
    const now = Date.now();
    if (now - lastSent < 30000 || !state.activeAlert) return;
    lastSent = now;
    const lat = +p.coords.latitude.toFixed(5), lng = +p.coords.longitude.toFixed(5);
    state.activeAlert.loc = {lat, lng, at: now}; save();
    Backend.updateAlertLocation(state.activeAlert.id, lat, lng).catch(() => {});

    if (line) line.textContent = t('Live location shared · updated just now','लाइव लोकेशन साझा · अभी अपडेट हुई');
  }, () => {}, {enableHighAccuracy: true, maximumAge: 15000});
}
function stopLiveLocation() { if (liveWatch !== null) navigator.geolocation.clearWatch(liveWatch); liveWatch = null; }

/* Big buttons arm on the first tap and send on the second, so a slip of the hand sends nothing. */

}

/* ---------- 3. Alerts arriving for caretakers and elderly homes ---------- */
state.seenAlerts ||= [];
const careAlert = document.createElement('dialog');
careAlert.id = 'care-alert'; careAlert.setAttribute('aria-labelledby', 'care-alert-title');
document.body.append(careAlert);
const alertTitle = a => {
  const name = a.elder?.full_name || t('Someone in your care','आपकी देखभाल में कोई');
  return a.kind === 'missed_dose' ? t(`${name} has not checked in a medicine`, `${name} ने दवा का चेक-इन नहीं किया`)
    : a.kind === 'abandoned' ? t(`${name} needs a safe place`, `${name} को सुरक्षित जगह चाहिए`)
    : t(`${name} needs help`, `${name} को मदद चाहिए`);
};
const alertMessage = a => a.kind === 'missed_dose' ? (a.message || '').replace(/^No check-in yet for /, t('No check-in yet for ','अभी तक चेक-इन नहीं: '))
  : a.kind === 'abandoned' ? t('They say they have been left alone and need a safe place.','उनका कहना है कि उन्हें अकेला छोड़ दिया गया है और सुरक्षित जगह चाहिए।')
  : t('They pressed “Alert my family”.','उन्होंने “परिवार को बुलाएँ” दबाया।');
function alertActions(a) {
  const phone = a.elder?.phone;
  return `${phone ? `<a class="btn small" href="tel:${esc(phone)}">${icon('phone')}${t('Call','कॉल')}</a><a class="btn secondary small" target="_blank" rel="noopener" href="${esc(waTo(phone, t('I saw your alert on Aegis Home. I am on my way / calling you now.','मैंने Aegis Home पर आपका अलर्ट देखा। मैं आ रहा/रही हूँ / अभी फ़ोन कर रहा/रही हूँ।')))}">WhatsApp</a>` : ''}${a.lat != null ? `<a class="btn secondary small" target="_blank" rel="noopener" href="${mapsLink(a.lat, a.lng)}">${icon('pin')}${t('Live location','लाइव लोकेशन')}</a>` : ''}${a.status === 'open' ? `<button class="btn secondary small" data-ack="${a.id}">${t('I’m on it','मैं देख रहा/रही हूँ')}</button>` : ''}${a.status !== 'resolved' ? `<button class="btn secondary small" data-resolve="${a.id}">${t('Resolved','हल हो गया')}</button>` : ''}`;
}
const statusLabel = a => a.status === 'open' ? `<span class="dose-status missed">${t('Needs attention','ध्यान चाहिए')}</span>` : a.status === 'acknowledged' ? `<span class="dose-status due">${t('Someone is on it','कोई देख रहा है')}</span>` : `<span class="dose-status taken">${t('Resolved','हल हो गया')}</span>`;
function alertRow(a) {
  return `<div class="alert-row"><div class="details"><h3>${esc(alertTitle(a))}</h3><p>${esc(alertMessage(a))}</p><p class="muted">${ago(a.created_at)}${a.lat != null && a.kind !== 'missed_dose' ? ` · ${t('location updated','लोकेशन अपडेट')} ${ago(a.updated_at || a.created_at)}` : ''}</p>${statusLabel(a)}</div><div class="row-actions">${alertActions(a)}</div></div>`;
}
function showCareAlert(a) {
  if (state.seenAlerts.includes(a.id)) return;
  state.seenAlerts = [...state.seenAlerts, a.id].slice(-150); save();
  careAlert.innerHTML = `<div class="alarm-kind">${a.kind === 'missed_dose' ? t('Medicine check-in','दवा चेक-इन') : t('Help needed','मदद चाहिए')}</div><h2 id="care-alert-title">${esc(alertTitle(a))}</h2><p>${esc(alertMessage(a))}</p><p class="muted">${ago(a.created_at)}</p><div class="alarm-actions">${alertActions(a)}<button class="btn" data-close-care-alert>${t('Close','बंद करें')}</button></div>`;
  bindAlertButtons(careAlert);
  careAlert.querySelector('[data-close-care-alert]').onclick = () => careAlert.close();
  if (!careAlert.open) careAlert.showModal();
  if (typeof alarmAudio !== 'undefined' && alarmAudio?.state === 'running') chime();
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification(alertTitle(a), {body: alertMessage(a), tag: a.id}); } catch { /* not supported on this phone */ }
  }
  if (state.narrator) speakText(`${alertTitle(a)}. ${alertMessage(a)}`);
}
function bindAlertButtons(root) {
  root.querySelectorAll('[data-ack]').forEach(b => b.onclick = async () => { try { await Backend.acknowledgeAlert(b.dataset.ack); refreshAlerts(); careAlert.open && careAlert.close(); toast(t('They will see that someone is on it.','उन्हें पता चलेगा कि कोई देख रहा है।')); } catch { toast(t('Please try again.','फिर कोशिश करें।')); } });
  root.querySelectorAll('[data-resolve]').forEach(b => b.onclick = async () => { try { await Backend.resolveAlert(b.dataset.resolve); refreshAlerts(); careAlert.open && careAlert.close(); } catch { toast(t('Please try again.','फिर कोशिश करें।')); } });
}
let watching = null, inbox = {alerts: null, loading: false}, pollTimer;
async function refreshAlerts() {
  if (!Backend.available() || !Backend.profile() || inbox.loading) return;
  inbox.loading = true;
  try { inbox.alerts = await Backend.alerts({limit: 20}); } catch { inbox.alerts ||= []; }
  inbox.loading = false;
  const mine = Backend.profile()?.id;
  if (role() !== 'grandparent') {
    for (const a of inbox.alerts) if (a.elder_id !== mine && a.status === 'open' && Date.now() - new Date(a.created_at) < 86400000) showCareAlert(a);
  }
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
  if ((page === 'care' || page === 'help') && !typing && !document.querySelector('#modal').open) render();
}
function startWatching() {
  if (watching || !Backend.available() || !Backend.profile()) return;
  watching = Backend.watchAlerts(() => refreshAlerts());
  refreshAlerts();
  clearInterval(pollTimer);
  pollTimer = setInterval(refreshAlerts, 60000); // a safety net if live updates are interrupted
}
function stopWatching() { watching?.(); watching = null; clearInterval(pollTimer); inbox = {alerts: null, loading: false}; }

/* Caretakers: open alerts at the top, and "Today's care" for each person. Homes: alerts sent to them. */
const careBeforeStep6 = carePage;
carePage = function() {
  let html = careBeforeStep6();
  const r = role();
  if (r !== 'caretaker' && r !== 'elderly_home') return html;
  if (!inbox.alerts && !inbox.loading) refreshAlerts();
  const list = (inbox.alerts || []).filter(a => a.elder_id !== Backend.profile().id);
  const open = list.filter(a => a.status !== 'resolved');
  const notify = 'Notification' in window && Notification.permission === 'default' ? `<button class="text-btn" data-allow-notify>${icon('bell')}${t('Also notify me when this page is in the background','पेज पीछे हो तब भी सूचना दें')}</button>` : '';
  const section = `<section class="card wide-card alerts-card"><div class="card-head"><div class="card-title">${icon('bell')}<h2>${r === 'elderly_home' ? t('Alerts sent to your home','आपके आश्रम को भेजे गए अलर्ट') : t('Alerts','अलर्ट')}</h2></div>${notify}</div>${inbox.alerts === null ? `<p class="empty">${t('Loading…','लोड हो रहा है…')}</p>` : (r === 'elderly_home' ? list : open).length ? (r === 'elderly_home' ? list : open).map(alertRow).join('') : `<p class="empty">${t('No alerts right now. New ones appear here instantly.','अभी कोई अलर्ट नहीं। नए अलर्ट यहाँ तुरंत दिखेंगे।')}</p>`}</section>`;
  if (r === 'elderly_home') return html + section;
  for (const l of circle.links || []) html = html.replace(`<button class="btn secondary small danger" data-link-remove="${l.id}">`, `<button class="btn secondary small" data-today="${l.elder.id}" data-name="${esc(l.elder.full_name)}">${icon('pill')}${t('Today’s care','आज की देखभाल')}</button><button class="btn secondary small danger" data-link-remove="${l.id}">`);
  return html.replace('<section', `${section}<section`);
};
async function showToday(elderId, name) {
  modal(t(`Today for ${name}`, `${name} का आज`), `<p class="empty">${t('Loading…','लोड हो रहा है…')}</p>`);
  try {
    const day = todayIST(), data = await Backend.elderToday(elderId, day);
    const nowMinutes = (() => { const p = new Intl.DateTimeFormat('en-GB', {timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'}).format(new Date()).split(':'); return +p[0] * 60 + +p[1]; })();
    const meds = data.medicines.map(m => {
      const [h, mm] = m.time_ist.split(':').map(Number), late = nowMinutes - (h * 60 + mm);
      const status = m.checkin ? 'taken' : late >= 30 ? 'missed' : late >= 0 ? 'due' : 'upcoming';
      const label = {taken: t(`Checked in ${ago(m.checkin?.taken_at)}`, `चेक-इन हुआ ${ago(m.checkin?.taken_at)}`), missed: t('No check-in yet · time passed','अभी चेक-इन नहीं · समय बीत गया'), due: t('Due now','अभी का समय'), upcoming: t('Later today','आज बाद में')}[status];
      return `<div class="today-med"><div class="details"><h3>${esc(m.name)}</h3><p class="muted">${time(m.time_ist.slice(0, 5))}${m.dose ? ` · ${esc(m.dose)}` : ''}</p><span class="dose-status ${status}">${label}</span></div>${m.checkin?.photo ? `<a href="${esc(m.checkin.photo)}" target="_blank" rel="noopener"><img class="today-photo" src="${esc(m.checkin.photo)}" alt="${t('Check-in photo','चेक-इन फ़ोटो')}"></a>` : ''}</div>`;
    }).join('') || `<p class="empty">${t('No medicines shared yet. They appear when your grandparent signs in on their phone.','अभी कोई दवा साझा नहीं। दादा/दादी के फ़ोन पर साइन इन करते ही दिखेंगी।')}</p>`;
    const m = document.querySelector('#modal');
    if (!m.open) return;
    modal(t(`Today for ${name}`, `${name} का आज`), `<h3>${t('Medicines','दवाएँ')}</h3>${meds}${data.alerts.length ? `<h3 style="margin-top:20px">${t('Recent alerts','हाल के अलर्ट')}</h3>${data.alerts.slice(0, 5).map(a => alertRow({...a, elder: {full_name: name}})).join('')}` : ''}<p class="muted" style="margin-top:16px">${t('A photo records a check-in. It cannot prove the medicine was taken.','फ़ोटो चेक-इन दर्ज करती है। इससे दवा लेने का पक्का सबूत नहीं मिलता।')}</p>`);
    bindAlertButtons(document.querySelector('#modal'));
  } catch {
    modal(t(`Today for ${name}`, `${name} का आज`), `<div class="notice">${t('Could not load. Please check your internet.','लोड नहीं हुआ। कृपया इंटरनेट देखें।')}</div>`);
  }
}

/* ---------- Wiring ---------- */
const bindBeforeStep6 = bind;
bind = function() {
  bindBeforeStep6();
  document.querySelectorAll('#app [data-sos]').forEach(bindSos);
  document.querySelector('[data-safe]')?.addEventListener('click', imSafe);
  document.querySelectorAll('#app [data-account-open]').forEach(b => b.onclick = openAccount);
  document.querySelector('[data-share-location]')?.addEventListener('click', async () => {
    toast(t('Finding your location…','आपकी जगह ढूँढ रहे हैं…'));
    const loc = await getLocation();
    if (!loc) return toast(t('Please allow location and try again.','कृपया लोकेशन की अनुमति दें और फिर कोशिश करें।'));
    open(waAny(`${t('This is where I am','मैं यहाँ हूँ')}: ${mapsLink(loc.lat, loc.lng)} (Aegis Home)`), '_blank', 'noopener');
  });
  document.querySelectorAll('[data-today]').forEach(b => b.onclick = () => showToday(b.dataset.today, b.dataset.name));
  document.querySelector('[data-allow-notify]')?.addEventListener('click', async () => { try { await Notification.requestPermission(); } catch {} render(); });
  bindAlertButtons(document.querySelector('#app'));
  if (Backend.profile()) { startWatching(); if (isElder()) { queueSync(); startLiveLocation(); } }
  else if (watching) stopWatching();
};
/* Pick up an alert left open from an earlier visit, unless someone already resolved it. */
window.backendReady.then(async online => {
  if (!online || !state.activeAlert || !isElder()) return;
  const a = await Backend.getAlert(state.activeAlert.id).catch(() => null);
  if (!a || a.status === 'resolved') { state.activeAlert = null; save(); render(); }
  else startLiveLocation();
