function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',4000)}
function header(title,subtitle){return `<div class="page-heading"><div class="eyebrow">${t('YOUR SPACE. YOUR PACE.','आपकी जगह। आपकी रफ़्तार।')}</div><h1>${title}</h1><p class="muted">${subtitle}</p></div>`}
function render(){document.documentElement.lang=state.lang;document.body.classList.toggle('large',state.large);document.querySelector('#app').innerHTML=`<aside class="sidebar"><div class="brand"><svg class="brand-mark" viewBox="0 0 40 46" aria-hidden="true"><path d="m20 3 15 6v13c0 10-15 20-15 20S5 32 5 22V9Z"/><path d="M20 32V14m0 12c-9 0-11-7-11-7 7-2 11 7 11 7Zm0-4c8 0 10-8 10-8-7-1-10 8-10 8Z"/></svg><div class="brand-name">Aegis Home<small>CARE, CLOSER TO HOME</small></div></div><div class="nav-label">${t('YOUR EVERYDAY','आपका हर दिन')}</div><nav aria-label="${t('Main navigation','मुख्य मेनू')}">${navs.map(([id,en,hi])=>`<button data-page="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}>${icon(ni[id]||id)}<span>${t(en,hi)}</span></button>`).join('')}</nav><div class="sidebar-bottom"><div class="help-card">${icon('care')}<strong> ${t('A little help?','थोड़ी मदद चाहिए?')}</strong><p>${t('Your loved ones are always a little closer.','आपके अपने हमेशा आपके करीब हैं।')}</p><button data-page="care">${t('My care circle','मेरा देखभाल समूह')} ${icon('arrow')}</button></div><div class="sidebar-foot">${t('Made with care, for you.','आपके लिए, प्यार से।')}</div></div></aside><div class="workspace"><header class="topbar"><div class="breadcrumb">${t('My home','मेरा घर')} <span style="margin:0 10px;color:#c9bda5">/</span> ${t(navs.find(x=>x[0]===page)[1],navs.find(x=>x[0]===page)[2])}</div><div class="top-actions"><div class="lang" aria-label="Language / भाषा"><button data-lang="en" class="${state.lang==='en'?'active':''}" aria-pressed="${state.lang==='en'}">English</button><button data-lang="hi" class="${state.lang==='hi'?'active':''}" aria-pressed="${state.lang==='hi'}">हिन्दी</button></div><button class="icon-btn" data-action="size" aria-label="${t('Toggle larger text','बड़े अक्षर चुनें')}" aria-pressed="${state.large}">A<span style="font-size:10px;position:absolute;margin:16px 0 0 19px">+</span></button><button class="icon-btn" data-action="notifications" aria-label="${t('Reminders','रिमाइंडर')}">${icon('bell')}</button><div class="profile"><div class="avatar">${t('S','स')}</div><span>${t('Your home','आपका घर')}<small>${t('Sample profile','नमूना प्रोफ़ाइल')}</small></span></div></div></header><main id="main">${({home:home,meds:medsPage,routine:routinePage,appointments:appointmentsPage,music:musicPage,chat:chatPage,care:carePage,settings:settingsPage}[page])()}<div class="bottom-note">${icon('heart')}${t('A little care. A little comfort. Every day.','थोड़ी देखभाल। थोड़ा सुकून। हर दिन।')}</div></main></div>`;bind();}
function hero(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">${t('A LITTLE CARE, EVERY DAY','हर दिन, थोड़ी देखभाल')}</div><h2>${t('Your day, with a little<br>more peace of mind.','आपका हर दिन,<br>थोड़ा और सुकून भरा।')}</h2><p>${t('Your medicines, your moments of calm, and the people who care. All together, right here.','आपकी दवाएँ, सुकून के पल और आपके अपने। सब एक साथ, यहीं।')}</p><div class="hero-tags"><span>${icon('shield')}${t('Care on your terms','आपकी इच्छा से देखभाल')}</span><span>${icon('heart')}${t('Made for your everyday','आपके हर दिन के लिए')}</span></div></div><svg class="hero-art" viewBox="0 0 280 240" aria-hidden="true"><circle cx="155" cy="113" r="94" stroke-width=".6"/><circle cx="155" cy="113" r="82" stroke-width=".4" stroke-dasharray="2 5"/><path d="M45 223h215M65 229h175" stroke-width=".7"/><path d="M153 206C90 164 94 107 153 57c59 50 63 107 0 149Z" fill="#e8d5a955"/><path d="M153 206C78 201 49 146 67 102c47 8 82 53 86 104Zm0 0c75-5 104-60 86-104-47 8-82 53-86 104Z" fill="#eddcb955"/><path d="M153 206C82 225 38 194 32 155c47-10 88 13 121 51Zm0 0c71 19 115-12 121-51-47-10-88 13-121 51Z" fill="#e7d1a255"/><path d="M153 205V91m0 112-56-70m56 70 56-70" stroke-width=".7"/><path d="m153 10 3 7-3 7-3-7Z" fill="#a48144"/></svg></section>`}
function home(){return `<div class="intro"><div><div class="eyebrow">${t('WELCOME TO YOUR EVERYDAY','आपके अपने घर में स्वागत है')}</div><h1>${t('Namaste. Make yourself at home.','नमस्ते। यह आपका अपना घर है।')}</h1></div><div class="date">${icon('calendar')}${new Date().toLocaleDateString(state.lang==='hi'?'hi-IN':'en-IN',{weekday:'short',day:'numeric',month:'long',timeZone:'Asia/Kolkata'})}</div></div>${hero()}<div class="grid"><div class="stack">${medCard()}${routineCard()}<div class="card chat-card"><div class="chat-bubble">${icon('chat')}</div><div><h3>${t('A little conversation feels good.','थोड़ी बातचीत, अच्छा लगता है।')}</h3><p class="muted">${t('Meet Saathi, your friendly companion.','मिलिए साथी से, आपके हमसफ़र।')}</p></div><button class="text-btn" data-page="chat">${t('Let’s talk','बात करें')}${icon('arrow')}</button></div></div><div class="stack">${musicCard()}${appointmentCard()}<div class="card card-pad"><div class="card-title">${icon('care')}<h3 style="margin:0">${t('Care feels better, together.','अपनों के साथ, बेहतर देखभाल।')}</h3></div><p class="muted" style="margin:14px 0 8px;font-size:12px">${t('Choose who can support you with your daily care. You stay in control.','अपनी देखभाल में किसकी मदद चाहिए, यह आप चुनें। निर्णय आपका है।')}</p><button class="text-btn" data-page="care">${t('See my care circle','मेरा देखभाल समूह देखें')} ${icon('arrow')}</button></div></div></div><div class="notice" style="font-size:11px">${t('Interactive preview · Sample data stays in this browser. Email reminders, secure sharing and live AI are not connected yet.','इंटरैक्टिव पूर्वावलोकन · नमूना डेटा इसी ब्राउज़र में रहता है। ईमेल रिमाइंडर, सुरक्षित साझाकरण और लाइव AI अभी जुड़े नहीं हैं।')}</div>`}
function medRows(edit=false){return state.meds.map(m=>`<div class="med ${m.taken?'done':''}"><div class="med-icon">${icon(m.taken?'check':'pill')}</div><div class="med-info"><h3>${esc(localName(m))}</h3><p>${esc(state.lang==='hi'?(m.doseHi||m.dose):m.dose)} · ${esc(state.lang==='hi'?(m.noteHi||m.note):m.note)}</p>${edit?`<button class="text-btn" data-edit-med="${m.id}">${t('Edit medicine','दवा बदलें')}</button>`:''}</div><div><div class="med-time">${time(m.time)}</div><button class="${m.taken?'taken':'btn small'}" data-take="${m.id}">${m.taken?icon('check'):''}${m.taken?t('Taken · undo','ले ली · वापस करें'):t('Mark as taken','ले ली है')}</button></div></div>`).join('')||`<p class="empty">${t('Add your first medicine schedule.','अपनी पहली दवा का समय जोड़ें।')}</p>`}
function medCard(){const count=state.meds.filter(m=>m.taken).length;return `<section class="card"><div class="card-pad"><div class="card-head"><div class="card-title">${icon('pill')}<h2>${t('Today’s medicines','आज की दवाएँ')}</h2></div><button class="text-btn" data-page="meds">${t('View all','सभी देखें')}${icon('arrow')}</button></div><div class="progress-line"><span>${t('A small step towards feeling your best.','अपना ख्याल रखने का एक छोटा कदम।')}</span><span>${count}/${state.meds.length} ${t('taken','ली गईं')}</span></div><div class="progress"><div style="width:${state.meds.length?100*count/state.meds.length:0}%"></div></div>${medRows()}</div><div class="card-foot">${icon('bell')}${t('Reminder setup available in My medicines','रिमाइंडर सेटअप मेरी दवाएँ में उपलब्ध है')}</div></section>`}
function routineRows(){return state.routines.map(r=>`<div class="routine-row"><button data-routine="${r.id}" class="${r.done?'checked':''}" aria-label="${esc(localName(r))}" aria-pressed="${r.done}">${r.done?icon('check'):''}</button><div class="details"><strong>${esc(localName(r))}</strong><small>${time(r.time)}</small></div>${icon(r.type)}</div>`).join('')}
function routineCard(){return `<section class="card card-pad"><div class="card-head"><div class="card-title">${icon('sun')}<h2>${t('Little daily rituals','हर दिन की छोटी आदतें')}</h2></div><button class="text-btn" data-page="routine">${t('My routine','मेरी दिनचर्या')}${icon('arrow')}</button></div>${routineRows()}</section>`}
function musicCard(){return `<section class="card music-card"><div class="music-top"><div><div class="eyebrow">${t('A MOMENT FOR YOU','एक पल, अपने लिए')}</div><h2 style="margin-top:9px">${t('Find your little calm.','पाइए थोड़ा सुकून।')}</h2></div><div class="music-emblem">${icon('lotus')}</div></div><p class="muted">${t('A familiar melody. A quiet breath. Your time.','एक जानी-पहचानी धुन। एक शांत साँस। आपका समय।')}</p><div class="music-options"><button data-music="bhajan">${icon('music')}${t('Bhajans','भजन')}</button><button data-music="meditate">${icon('lotus')}${t('Meditate','ध्यान')}</button></div><button class="text-btn" data-music="classical">${t('Explore classical & favourites','शास्त्रीय संगीत और पसंदीदा गाने')}${icon('arrow')}</button></section>`}
function appointmentCard(){let a=state.appointments[0];return `<section class="card card-pad"><div class="card-head"><div class="card-title">${icon('calendar')}<h2>${t('Next appointment','अगला अपॉइंटमेंट')}</h2></div></div>${a?appointmentRow(a):`<p class="muted">${t('A clear calendar, a calmer mind. Add your next doctor visit here.','अगली डॉक्टर की मुलाकात यहाँ जोड़ें, ताकि याद रखना आसान हो।')}</p>`}<button class="btn secondary" style="width:100%" data-action="appointment">${icon('plus')}${t('Add appointment','अपॉइंटमेंट जोड़ें')}</button></section>`}

function medsPage(){return `${header(t('My medicines','मेरी दवाएँ'),t('Your schedule, easy to follow. Add only what your clinician has prescribed.','आपकी दवाओं का आसान समय-पत्र। केवल डॉक्टर की लिखी दवाएँ जोड़ें।'))}<div class="card wide-card"><div class="card-head"><h2>${t('Medicine schedule','दवाओं का समय')}</h2><button class="btn" data-action="add-med">${icon('plus')}${t('Add medicine','दवा जोड़ें')}</button></div>${medRows(true)}</div><div class="notice">${t('These are sample medicine entries, not treatment advice. Taken records in this preview are local demo records, not a clinical adherence history.','ये नमूना प्रविष्टियाँ हैं, इलाज की सलाह नहीं। इस पूर्वावलोकन में दवा लेने के रिकॉर्ड केवल स्थानीय नमूने हैं।')}</div><div class="card wide-card"><h2>${t('Email reminders','ईमेल रिमाइंडर')}</h2><p class="muted">${t('Upcoming doses, missed doses and appointments will have separate reminders. Email delivery needs the backend connection.','आने वाली दवाओं, छूटी दवाओं और अपॉइंटमेंट के लिए अलग रिमाइंडर होंगे। ईमेल भेजने के लिए बैकएंड कनेक्शन चाहिए।')}</p><button class="btn secondary" data-action="notifications">${t('See reminder plan','रिमाइंडर योजना देखें')}</button></div>`}
function routinePage(){return `${header(t('My daily routine','मेरी दिनचर्या'),t('Small moments that make the day feel like yours.','छोटी-छोटी आदतें, जो दिन को अपना बनाती हैं।'))}<div class="card wide-card"><div class="card-head"><h2>${t('My rituals','मेरी आदतें')}</h2><button class="btn" data-action="add-routine">${icon('plus')}${t('Add activity','गतिविधि जोड़ें')}</button></div>${routineRows()}</div><p class="muted" style="margin-top:18px">${t('Sample activities are optional. Choose routines that suit your needs and your clinician’s guidance.','नमूना गतिविधियाँ वैकल्पिक हैं। अपनी ज़रूरत और डॉक्टर की सलाह के अनुसार दिनचर्या चुनें।')}</p>`}
function appointmentsPage(){return `${header(t('My appointments','मेरे अपॉइंटमेंट'),t('Keep the next visit, and its details, in one place.','अगली मुलाकात की सारी जानकारी एक जगह रखें।'))}<div class="card wide-card"><div class="card-head"><h2>${t('Upcoming visits','आने वाली मुलाकातें')}</h2><button class="btn" data-action="appointment">${icon('plus')}${t('Add visit','मुलाकात जोड़ें')}</button></div>${state.appointments.length?state.appointments.map(a=>`<div class="settings-row">${appointmentRow(a)}<button class="text-btn danger" data-delete-appointment="${a.id}">${t('Remove','हटाएँ')}</button></div>`).join(''):`<div class="empty">${icon('calendar')}<p>${t('No appointments yet. Add one when you’re ready.','अभी कोई अपॉइंटमेंट नहीं है। जब चाहें, जोड़ें।')}</p></div>`}</div>`}

</script><script>/* Date-scoped check-ins. Deliberately independent of the interface and camera. */
(function (root) {
  const parts = now => Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  }).formatToParts(now).map(p => [p.type, p.value]));
  const day = (now = new Date()) => { const p = parts(now); return `${p.year}-${p.month}-${p.day}`; };
  const key = (id, now = new Date()) => `${day(now)}:${id}`;
  const status = (medicine, records, now = new Date()) => {
    if (records[key(medicine.id, now)]) return 'taken';
    const p = parts(now), [h, m] = medicine.time.split(':').map(Number);
    const elapsed = Number(p.hour) * 60 + Number(p.minute) - (h * 60 + m);
    return elapsed >= 30 ? 'missed' : elapsed >= 0 ? 'due' : 'upcoming';
  };
  const api = {day, key, status};
  if (typeof module !== 'undefined') module.exports = api;
  else root.DoseLedger = api;
})(globalThis);

  return new Promise((resolve, reject) => {
    const tx = db.transaction('photos', method === 'get' ? 'readonly' : 'readwrite');
    const store = tx.objectStore('photos');
    const request = method === 'put' ? store.put(blob, key) : store[method](key);
    tx.oncomplete = () => resolve(request.result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('Storage interrupted'));
  });
}
function stopCamera() {
  cameraStream?.getTracks().forEach(track => track.stop());
  cameraStream = null;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = null;
}
document.querySelector('#modal').addEventListener('close', stopCamera);
window.addEventListener('pagehide', stopCamera);
const labels = () => ({taken:t('Check-in saved','चेक-इन सहेजा गया'), missed:t('Check-in still open · scheduled time passed','चेक-इन अभी खुला है · तय समय बीत गया'), due:t('Ready for your check-in?','चेक-इन के लिए तैयार हैं?'), upcoming:t('Coming up today','आज आने वाला समय')});
medRows = function(edit = false) {
  return [...state.meds].sort((a,b) => a.time.localeCompare(b.time)).map(m => {
    const status = DoseLedger.status(m, state.checkins), recorded = status === 'taken';
    return `<article class="med dose-row ${recorded?'done':''}"><div class="med-icon">${icon(recorded?'check':'pill')}</div><div class="med-info"><h3>${esc(localName(m))}</h3><p>${esc(state.lang==='hi'?(m.doseHi||m.dose):m.dose)} · ${esc(state.lang==='hi'?(m.noteHi||m.note):m.note)}</p><span class="dose-status ${status}">${labels()[status]}</span>${edit?`<button class="text-btn" data-edit-med="${m.id}">${t('Edit schedule','समय बदलें')}</button>`:''}</div><div class="dose-controls"><strong class="med-time">${time(m.time)}</strong><button class="btn ${recorded?'secondary':''}" data-checkin="${m.id}">${icon(recorded?'check':'plus')}${recorded?t('View check-in','चेक-इन देखें'):t('Take a photo','फोटो लें')}</button></div></article>`;
  }).join('') || `<p class="empty">${t('Add a medicine from your prescription to begin.','शुरू करने के लिए पर्चे में लिखी दवा जोड़ें।')}</p>`;
};
medCard = function() {
  const count = state.meds.filter(m => DoseLedger.status(m, state.checkins)==='taken').length;
  return `<section class="card"><div class="card-pad"><div class="card-head"><div class="card-title">${icon('pill')}<h2>${t("Today's medicines",'आज की दवाएं')}</h2></div><button class="text-btn" data-page="meds">${t('View all','सब देखें')}${icon('arrow')}</button></div><div class="progress-line"><span>${t('One check-in at a time.','एक-एक कदम, अपना खयाल रखें।')}</span><strong>${count}/${state.meds.length} ${t('recorded','दर्ज')}</strong></div><div class="progress" role="progressbar" aria-label="${t('Daily check-ins','आज के चेक-इन')}" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="${state.meds.length||1}"><div style="width:${state.meds.length?count/state.meds.length*100:0}%"></div></div>${medRows()}</div><div class="card-foot">${t('Times follow India Standard Time.','सभी समय भारतीय मानक समय के अनुसार हैं।')}</div></section>`;
};
medsPage = function() {
  return `${header(t('Your medicines, one step at a time.','आपकी दवाएं, एक-एक कदम।'),t('Follow your prescription. A photo saves your daily check-in.','अपने पर्चे का पालन करें। फोटो से आज का चेक-इन सहेजें।'))}<div class="notice">${t('Private device preview. Photos stay in this browser. Your care circle cannot see them yet, and no missed-dose messages are sent.','निजी डिवाइस पूर्वावलोकन। फोटो इसी ब्राउज़र में रहती हैं। आपके देखभाल साथी अभी इन्हें नहीं देख सकते और दवा छूटने के संदेश नहीं भेजे जाते।')}</div><section class="card wide-card"><div class="card-head"><h2>${t("Today's medicines",'आज की दवाएं')}</h2><button class="btn" data-action="add-med">${icon('plus')}${t('Add medicine','दवा जोड़ें')}</button></div>${medRows(true)}</section><p class="notice">${t('“Check-in still open” means no check-in was saved within 30 minutes of the scheduled time. It does not prove a dose was missed. A photo cannot confirm swallowing. If you are unsure about a dose, ask your doctor or pharmacist.','“समय बीत गया” का अर्थ है तय समय के 30 मिनट बाद भी चेक-इन दर्ज नहीं हुआ। इससे दवा छूटना साबित नहीं होता। फोटो से दवा निगलने की पुष्टि नहीं होती। दवा को लेकर संदेह हो तो डॉक्टर या फार्मासिस्ट से पूछें।')}</p><section class="card wide-card"><h2>${t('Recent check-ins','हाल के चेक-इन')}</h2>${Object.entries(state.checkins).sort((a,b)=>b[1].at.localeCompare(a[1].at)).slice(0,14).map(([key,r])=>`<div class="history-row"><strong>${esc(r.name)}</strong><span>${new Date(r.at).toLocaleString(state.lang==='hi'?'hi-IN':'en-IN',{timeZone:'Asia/Kolkata'})}</span><button class="text-btn" data-history="${esc(key)}">${t('View photo','फोटो देखें')}</button></div>`).join('')||`<p class="muted">${t('Your saved check-ins will appear here.','आपके सहेजे गए चेक-इन यहां दिखेंगे।')}</p>`}</section>`;
};
async function showCheckin(key) {
  const record = state.checkins[key];
  if (!record) return;
  modal(t('Your saved check-in','आपका सहेजा हुआ चेक-इन'), `<p>${esc(record.name)}</p><p class="muted">${new Date(record.at).toLocaleString(state.lang==='hi'?'hi-IN':'en-IN',{timeZone:'Asia/Kolkata'})} IST</p><div id="saved-photo" role="status">${t('Opening photo…','फोटो खुल रही है…')}</div><p class="notice">${t('Only on this device. Not shared with your care circle.','सिर्फ इस डिवाइस पर। देखभाल साथियों से साझा नहीं किया गया।')}</p><button class="btn secondary" id="remove-checkin">${t('Remove this check-in','यह चेक-इन हटाएं')}</button>`);
  try {
    const blob = await photoStore('get',record.photoId);
    if (!blob) throw new Error('Missing photo');
    if (!document.querySelector('#saved-photo')) return;
    previewUrl = URL.createObjectURL(blob);
    document.querySelector('#saved-photo').innerHTML = `<img class="checkin-photo" src="${previewUrl}" alt="${t('Your medication check-in photo','दवा लेते समय आपकी फोटो')}">`;
  } catch { const el=document.querySelector('#saved-photo'); if(el) el.textContent=t('The photo is unavailable on this device.','इस डिवाइस पर फोटो उपलब्ध नहीं है।'); }
  const remove = document.querySelector('#remove-checkin');
  if (remove) remove.onclick = () => {
    modal(t('Remove this record?','यह रिकॉर्ड हटाएं?'), `<p>${t('The photo and check-in will be deleted from this browser. This does not mean you should take another dose.','फोटो और चेक-इन इस ब्राउज़र से हट जाएंगे। इसका मतलब यह नहीं कि आपको फिर से दवा लेनी चाहिए।')}</p><button class="btn" id="confirm-remove">${t('Delete photo and check-in','फोटो और चेक-इन हटाएं')}</button>`);
    stopCamera();
    document.querySelector('#confirm-remove').onclick = async () => {
      try {
        const next = {...state.checkins}; delete next[key];
        localStorage.setItem('aegis-step2-v1',JSON.stringify({...state,checkins:next}));
        state.checkins = next;
        await photoStore('delete',record.photoId);
        document.querySelector('#modal').close(); render();
      } catch { toast(t('Could not finish deleting. Please try again.','हटाया नहीं जा सका। फिर कोशिश करें।')); }
    };
  };
}
function startCheckin(id) {
  const m = state.meds.find(x=>x.id===id); if(!m) return;
  const key = DoseLedger.key(id);
  if(state.checkins[key]) return showCheckin(key);
  captureDay = DoseLedger.day(); captureId = id; photoBlob = null; stopCamera();
  modal(t('A photo for your check-in','चेक-इन के लिए एक फोटो'), `<p><strong>${esc(localName(m))}</strong> · ${time(m.time)}</p><p>${t('Follow your usual prescription. Take a photo when you are ready, then review it before saving.','अपने पर्चे का पालन करें। तैयार होने पर फोटो लें और सहेजने से पहले देखें।')}</p><div id="camera-area" class="camera-area"><p>${t('Your camera is off.','आपका कैमरा बंद है।')}</p></div><div class="capture-actions"><button class="btn" id="open-camera">${t('Open camera','कैमरा खोलें')}</button><button class="btn secondary" id="snap" hidden>${t('Take photo','फोटो लें')}</button></div><label>${t('Or use your phone camera / choose a photo','या फोन के कैमरे से लें / फोटो चुनें')}<input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" capture="user"></label><label class="consent"><input type="checkbox" id="photo-consent"> <span>${t('Save this photo on this device. I understand it is not shared yet.','यह फोटो इसी डिवाइस पर सहेजें। मैं समझता/समझती हूं कि यह अभी साझा नहीं होती।')}</span></label><p id="capture-status" role="status"></p><button class="btn" id="save-checkin" disabled>${t('Save as taken today','आज ली गई के रूप में सहेजें')}</button>`);
  const status = message => { const el=document.querySelector('#capture-status');if(el)el.textContent=message; };
  const ready = () => document.querySelector('#save-checkin').disabled = !(photoBlob && document.querySelector('#photo-consent').checked);
  const preview = blob => {
    if(!document.querySelector('#camera-area'))return;
    stopCamera(); photoBlob=blob; previewUrl=URL.createObjectURL(blob);
    document.querySelector('#camera-area').innerHTML=`<img class="checkin-photo" src="${previewUrl}" alt="${t('Review your photo before saving','सहेजने से पहले फोटो देखें')}">`;
    document.querySelector('#snap').hidden=true;
    document.querySelector('#open-camera').textContent=t('Retake photo','फिर फोटो लें');ready();
  };
  document.querySelector('#open-camera').onclick=async()=>{
    try {
      stopCamera(); photoBlob=null;ready();
      if(!navigator.mediaDevices?.getUserMedia)throw new Error('unavailable');
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
      if(!document.querySelector('#camera-area')){stream.getTracks().forEach(t=>t.stop());return;}
      cameraStream=stream;
      document.querySelector('#camera-area').innerHTML='<video id="camera-video" autoplay playsinline muted></video>';
      document.querySelector('#camera-video').srcObject=stream;
      document.querySelector('#snap').hidden=false;
      status(t('Camera ready. Take a photo when comfortable.','कैमरा तैयार है। आराम से फोटो लें।'));
    } catch {status(t('Camera could not open. Allow camera access or use the photo chooser below.','कैमरा नहीं खुला। कैमरे की अनुमति दें या नीचे से फोटो चुनें।'));}
  };
  document.querySelector('#snap').onclick=()=>{
    const video=document.querySelector('#camera-video');if(!video?.videoWidth)return;
    const canvas=document.createElement('canvas');canvas.width=Math.min(video.videoWidth,1280);canvas.height=video.videoHeight*canvas.width/video.videoWidth;
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
    canvas.toBlob(blob=>{if(blob)preview(blob);},'image/jpeg',.85);
  };
  document.querySelector('#photo-input').onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024){status(t('Choose a JPG, PNG or WebP under 10 MB.','10 MB से छोटी JPG, PNG या WebP फोटो चुनें।'));return;}
    try {
      const bitmap=await createImageBitmap(file);const canvas=document.createElement('canvas');
      canvas.width=Math.min(bitmap.width,1280);canvas.height=bitmap.height*canvas.width/bitmap.width;
      canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();
      canvas.toBlob(blob=>{if(blob)preview(blob);},'image/jpeg',.85);
    } catch { status(t('That photo could not be read. Try another photo.','फोटो खुल नहीं सकी। दूसरी फोटो चुनें।')); }
  };
  document.querySelector('#photo-consent').onchange=ready;
  document.querySelector('#save-checkin').onclick=async e=>{
    if(!photoBlob||!document.querySelector('#photo-consent').checked)return;
    if(captureDay!==DoseLedger.day()){status(t('A new day has started. Close this window and start a new check-in.','नया दिन शुरू हो गया है। यह खिड़की बंद करके नया चेक-इन करें।'));return;}
    e.target.disabled=true;
    const photoId=crypto.randomUUID();
    try {
      await photoStore('put',photoId,photoBlob);
      const next={...state.checkins,[DoseLedger.key(captureId)]:{name:localName(m),at:new Date().toISOString(),photoId}};
      localStorage.setItem('aegis-step2-v1',JSON.stringify({...state,checkins:next}));
      state.checkins=next;
      document.querySelector('#modal').close();render();toast(t('Today’s check-in saved on this device.','आज का चेक-इन इस डिवाइस पर सहेजा गया।'));
    } catch {
      await photoStore('delete',photoId).catch(()=>{});
      status(t('Could not save. Free some device storage and try again. The dose has not been marked taken.','सहेजा नहीं जा सका। डिवाइस में जगह खाली करें और फिर कोशिश करें। दवा ली गई के रूप में दर्ज नहीं हुई है।'));e.target.disabled=false;
    }
  };
}
const originalBind=bind;
bind=function(){originalBind();document.querySelectorAll('[data-checkin]').forEach(b=>b.onclick=()=>startCheckin(Number(b.dataset.checkin)));document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>showCheckin(b.dataset.history));};
actions.reset=()=>{
  modal(t('Start fresh?','नई शुरुआत करें?'),`<p>${t('This clears your saved preview schedules, conversations, check-ins and photos on this device.','इससे इस डिवाइस पर सहेजे गए पूर्वावलोकन के समय, बातचीत, चेक-इन और फोटो हट जाएंगे।')}</p><button class="btn" id="fresh-start">${t('Clear preview and start fresh','पूर्वावलोकन हटाकर नई शुरुआत करें')}</button>`);
  document.querySelector('#fresh-start').onclick=async()=>{
    try {await photoStore('clear');localStorage.removeItem('aegis-step2-v1');location.reload();}
    catch {toast(t('Please try again to finish clearing your preview.','पूर्वावलोकन पूरा साफ करने के लिए फिर कोशिश करें।'));}
  };
};
let lastMinute='';
setInterval(()=>{const stamp=new Date().toISOString().slice(0,16);if(stamp!==lastMinute){lastMinute=stamp;if(!document.querySelector('#modal').open&&['home','meds'].includes(page))render();}},15000);
render();
